# Render Blueprint for the API (Dashboard > New > Blueprint). The database is external.
# Free instances sleep after 15 minutes without traffic; the first request then takes about a minute.
services:
  - type: web
    name: neon-adda-api
    runtime: node
    plan: free
    # Next to the database (Neon, AWS us-east-2) and Vercel (Washington, D.C.).
    region: ohio
    branch: main
    buildCommand: >-
      corepack enable &&
      pnpm install --frozen-lockfile --prod=false &&
      pnpm build &&
      pnpm db:deploy &&
      pnpm db:seed
    startCommand: node dist/main.js
    healthCheckPath: /v1/health
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NODE_ENV
        value: production
      # PostgreSQL connection string, e.g. a free neon.tech database. Use the direct
      # (unpooled) string: migrations do not run through the pooler.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: 'true'
      - key: REQUIRE_ADMIN_2FA
        value: 'false'
      # Added later under Environment, all optional:
      # - META_WA_ACCESS_TOKEN, META_WA_PHONE_NUMBER_ID: sign-in codes on WhatsApp (shown on screen until set)
      # - ANTHROPIC_API_KEY: the studio's design assistant (hidden until set)
      # - S3_ENDPOINT, S3_BUCKET, S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY: keep uploads across deploys
      # - FIREBASE_PROJECT_ID, FIREBASE_CLIENT_EMAIL, FIREBASE_PRIVATE_KEY: push notifications
