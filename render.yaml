# Render Blueprint for the API and its database (Dashboard > New > Blueprint).
# Free instances sleep after 15 minutes without traffic; the first request then takes about a minute.
services:
  - type: web
    name: neon-adda-api
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: >-
      corepack enable &&
      pnpm install --frozen-lockfile --prod=false &&
      pnpm build &&
      pnpm db:deploy &&
      pnpm db:seed
    startCommand: node dist/main.js
    healthCheckPath: /v1/health
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: neon-adda-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: 'true'
      - key: REQUIRE_ADMIN_2FA
        value: 'false'
      # WhatsApp (META_WA_ACCESS_TOKEN, META_WA_PHONE_NUMBER_ID) and Firebase keys are added
      # later under Environment. Until then sign-in codes are shown on screen.

databases:
  - name: neon-adda-db
    plan: free
    region: singapore
    databaseName: neonadda
    user: neonadda
